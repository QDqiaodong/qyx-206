server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:fire_training;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;LOCK_TIMEOUT=10000
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  data:
    redis:
      host: localhost
      port: 6399
      timeout: 500ms

logging:
  level:
    com.example.app: WARN
    org.hibernate.SQL: WARN
